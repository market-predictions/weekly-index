name: Send weekly indices report

on:
  push:
    branches:
      - main
    paths:
      - "control/run_queue/weekly_indices_report_request_*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages for PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-liberation \
            fonts-dejavu-core \
            fonts-lato

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown weasyprint matplotlib

      - name: Resolve requested close date and report token
        id: token_ctx
        run: |
          CLOSE_DATE=$(python tools/resolve_index_requested_close_date.py)
          REPORT_TOKEN=$(python -c "d='$CLOSE_DATE'; y,m,dd=d.split('-'); print(f'{y[2:]}{m}{dd}')")
          REPORT_PATH="output_indices/weekly_indices_review_${REPORT_TOKEN}.md"
          echo "requested_close_date=$CLOSE_DATE" >> "$GITHUB_OUTPUT"
          echo "report_token=$REPORT_TOKEN" >> "$GITHUB_OUTPUT"
          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "REQUESTED_CLOSE_DATE=$CLOSE_DATE" >> "$GITHUB_ENV"
          echo "REPORT_TOKEN=$REPORT_TOKEN" >> "$GITHUB_ENV"
          echo "REPORT_PATH=$REPORT_PATH" >> "$GITHUB_ENV"
          echo "Resolved requested close date: $CLOSE_DATE"
          echo "Resolved report token: $REPORT_TOKEN"
          echo "Resolved report path: $REPORT_PATH"

      - name: Prepare report file for requested close date
        run: |
          python tools/prepare_weekly_index_report_for_close.py --requested-close-date "${{ steps.token_ctx.outputs.requested_close_date }}"
          test -f "${{ steps.token_ctx.outputs.report_path }}"

      - name: Validate report token for requested close date
        run: |
          python tools/validate_index_report_token_for_close.py --requested-close-date "${{ steps.token_ctx.outputs.requested_close_date }}"

      - name: Run indices pricing pass
        run: |
          python -m pricing_indices.run_pricing_pass --requested-close-date "${{ steps.token_ctx.outputs.requested_close_date }}"

      - name: Validate benchmark-vs-proxy pricing contract
        run: |
          python tools/validate_index_pricing_contract.py

      - name: Build macro regime research snapshot
        run: |
          python -m research_indices.build_macro_regime_snapshot

      - name: Build relative strength research snapshot
        run: |
          python -m research_indices.build_relative_strength_snapshot

      - name: Build index macro policy pack
        run: |
          python -m research_indices.build_index_macro_policy_pack

      - name: Build candidate evidence packs
        run: |
          python -m research_indices.build_candidate_evidence

      - name: Generate candidate ranking and discovery coverage artifacts
        run: |
          python -m pricing_indices.generate_candidate_artifacts_for_token --token "${{ steps.token_ctx.outputs.report_token }}"

      - name: Build runtime index report state
        run: |
          python -m runtime_indices.build_index_report_state

      - name: Build alternative duels and short radar
        run: |
          python -m research_indices.build_index_alternative_duels
          python -m research_indices.build_index_short_radar

      - name: Validate alternative duels and short radar contracts
        run: |
          python tools/validate_index_alternative_duel_contract.py
          python tools/validate_index_short_radar_contract.py

      - name: Assemble artifact-driven report section drafts
        run: |
          python -m pricing_indices.assemble_report_sections --token "${{ steps.token_ctx.outputs.report_token }}"

      - name: Compose final report from assembled sections
        run: |
          python -m pricing_indices.compose_final_report --report-path "${{ steps.token_ctx.outputs.report_path }}" --in-place

      - name: Validate proxy performance table placement
        run: |
          python tools/validate_index_performance_table_placement.py

      - name: Scrub client-facing scaffold/process language
        run: |
          python tools/scrub_index_client_report.py

      - name: Validate canonical markdown polish
        run: |
          python tools/validate_index_markdown_polish.py

      - name: Validate report-vs-ranking reconciliation
        run: |
          python -m pricing_indices.validate_report_artifact_alignment

      - name: Validate index state consistency
        run: |
          python tools/validate_index_state_consistency_contract.py

      - name: Validate index report compactness
        run: |
          python tools/validate_index_compactness_contract.py

      - name: Validate index recommendation scorecard derivation before send
        run: |
          python tools/write_index_recommendation_scorecard.py --check-only

      - name: Validate English HTML/PDF render before send
        run: python send_index_report_tv_analyst_distinct.py --report-path "${{ steps.token_ctx.outputs.report_path }}" --validate-only

      - name: Validate English Analyst Report visual distinction
        run: |
          python tools/validate_index_analyst_visual_distinction_for_report.py --report-path "${{ steps.token_ctx.outputs.report_path }}"

      - name: Validate English rendered report polish
        run: |
          python tools/validate_index_render_polish_for_report.py --report-path "${{ steps.token_ctx.outputs.report_path }}"

      - name: Validate English ticker links
        run: |
          python tools/validate_index_ticker_links_for_report.py --report-path "${{ steps.token_ctx.outputs.report_path }}"

      - name: Send English email if SMTP secrets are configured
        env:
          MRKT_RPRTS_SUBJECT_PREFIX: Weekly Indices Review
          MRKT_RPRTS_SMTP_HOST: ${{ secrets.MRKT_RPRTS_SMTP_HOST }}
          MRKT_RPRTS_SMTP_PORT: ${{ secrets.MRKT_RPRTS_SMTP_PORT }}
          MRKT_RPRTS_SMTP_USER: ${{ secrets.MRKT_RPRTS_SMTP_USER }}
          MRKT_RPRTS_SMTP_PASS: ${{ secrets.MRKT_RPRTS_SMTP_PASS }}
          MRKT_RPRTS_MAIL_FROM: ${{ secrets.MRKT_RPRTS_MAIL_FROM }}
          MRKT_RPRTS_MAIL_TO: ${{ secrets.MRKT_RPRTS_MAIL_TO }}
        run: python send_index_report_tv_analyst_distinct.py --report-path "${{ steps.token_ctx.outputs.report_path }}"

      - name: Generate native Dutch companion from same state
        run: |
          TOKEN="${{ steps.token_ctx.outputs.report_token }}"
          NL_REPORT="output_indices/weekly_indices_review_nl_${TOKEN}.md"
          python tools/render_index_nl_report_from_state_v2.py --token "$TOKEN" --nl-report "$NL_REPORT"
          echo "NL_REPORT=$NL_REPORT" >> "$GITHUB_ENV"

      - name: Validate Dutch companion contracts
        run: |
          python tools/validate_index_nl_language_contract.py --nl-report "$NL_REPORT"
          python tools/validate_index_bilingual_section_parity.py \
            --en-report "${{ steps.token_ctx.outputs.report_path }}" \
            --nl-report "$NL_REPORT"
          python tools/validate_index_bilingual_numeric_parity.py \
            --en-report "${{ steps.token_ctx.outputs.report_path }}" \
            --nl-report "$NL_REPORT"

      - name: Render and validate Dutch companion before send
        run: |
          python send_index_report_bilingual.py --report-path "$NL_REPORT" --language nl --validate-only
          python tools/validate_index_no_markdown_link_residue.py --report-path "$NL_REPORT"
          python tools/validate_index_analyst_visual_distinction_for_report.py --report-path "$NL_REPORT"
          python tools/validate_index_render_polish_for_report.py --report-path "$NL_REPORT"
          python tools/validate_index_ticker_links_for_report.py --report-path "$NL_REPORT"

      - name: Send Dutch email if SMTP secrets are configured
        env:
          MRKT_RPRTS_SUBJECT_PREFIX: Weekly Index Review NL
          MRKT_RPRTS_SMTP_HOST: ${{ secrets.MRKT_RPRTS_SMTP_HOST }}
          MRKT_RPRTS_SMTP_PORT: ${{ secrets.MRKT_RPRTS_SMTP_PORT }}
          MRKT_RPRTS_SMTP_USER: ${{ secrets.MRKT_RPRTS_SMTP_USER }}
          MRKT_RPRTS_SMTP_PASS: ${{ secrets.MRKT_RPRTS_SMTP_PASS }}
          MRKT_RPRTS_MAIL_FROM: ${{ secrets.MRKT_RPRTS_MAIL_FROM }}
          MRKT_RPRTS_MAIL_TO: ${{ secrets.MRKT_RPRTS_MAIL_TO }}
        run: python send_index_report_bilingual.py --report-path "$NL_REPORT" --language nl

      - name: Write index recommendation scorecard
        if: success()
        run: |
          python tools/write_index_recommendation_scorecard.py

      - name: Write run manifest
        if: always()
        run: |
          python tools/write_weekly_indices_run_manifest_for_report.py --report-path "${{ steps.token_ctx.outputs.report_path }}" --conclusion "${{ job.status }}"

      - name: Commit composed reports, run manifest, research, macro, runtime, pricing state, scorecard, and candidate artifacts back to main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output_indices/weekly_indices_review_*.md \
            output_indices/weekly_indices_review_*_clean.md \
            output_indices/weekly_indices_review_*_delivery.html \
            output_indices/weekly_indices_review_*.pdf \
            output_indices/weekly_indices_review_*_equity_curve.png \
            output_indices/weekly_indices_review_*_delivery_manifest.txt \
            output_indices/run_manifests/*.json \
            output_indices/research/*.json \
            output_indices/macro/*.json \
            output_indices/runtime/*.json \
            output_indices/index_candidate_ranking_*.json \
            output_indices/index_discovery_coverage_*.json \
            output_indices/index_portfolio_state.json \
            output_indices/index_valuation_history.csv \
            output_indices/index_recommendation_scorecard.csv \
            output_indices/pricing/*.json || true
          if git diff --cached --quiet; then
            echo "No composed report, manifest, research, macro, runtime, pricing, scorecard, or candidate artifact changes to commit."
            exit 0
          fi
          git commit -m "Persist Weekly Indices run manifest and artifacts [skip ci]"
          git push origin HEAD:main
