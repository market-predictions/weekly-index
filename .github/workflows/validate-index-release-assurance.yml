name: Validate Weekly Index release assurance

on:
  pull_request:
    paths:
      - "control/INDEX_RELEASE_ASSURANCE_CONTRACT_V1.md"
      - "control/PROJECT_GOVERNANCE_BOOTSTRAP.md"
      - "tools/index_release_assurance.py"
      - "tests/test_index_release_assurance.py"
      - "send_index_report_tv_analyst_distinct.py"
      - "send_index_report_tv_analyst_distinct_legacy.py"
      - "send_index_report_bilingual.py"
      - "send_index_report_bilingual_legacy.py"
      - ".github/workflows/validate-index-release-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile assurance implementation
        run: |
          python -m py_compile \
            tools/index_release_assurance.py \
            send_index_report_tv_analyst_distinct.py \
            send_index_report_tv_analyst_distinct_legacy.py \
            send_index_report_bilingual.py \
            send_index_report_bilingual_legacy.py

      - name: Run positive and planted-failure contract tests
        run: python -m unittest tests.test_index_release_assurance -v
